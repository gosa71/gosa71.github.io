<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zona Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #video-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        #error-msg {
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin-top: 40vh;
            font-size: 24px;
        }
    </style>
    <!-- Библиотека MSX для связи HTML-страницы с плеером -->
    <script type="text/javascript" src="https://msx.benzac.de/js/tvx-plugin.min.js"></script>
</head>
<body>

    <iframe id="video-frame" src="" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('tmdb_id');
        const frame = document.getElementById('video-frame');
        const body = document.body;
        const API_KEY = '65f645cfefa38f91de626946336499b0';

        // Фиктивная длительность/позиция — реальный embed-плеер
        // не сообщает нам данные о ходе воспроизведения,
        // поэтому просто "тикаем" секундами, пока страница открыта.
        let fakeDuration = 7200; // 2 часа "по умолчанию"
        let fakePosition = 0;
        let isPlaying = false;
        let tickTimer = null;

        function startTicking() {
            stopTicking();
            tickTimer = setInterval(() => {
                if (isPlaying && fakePosition < fakeDuration) {
                    fakePosition += 1;
                }
            }, 1000);
        }

        function stopTicking() {
            if (tickTimer) {
                clearInterval(tickTimer);
                tickTimer = null;
            }
        }

        function showError(message) {
            body.innerHTML = '<h1 id="error-msg">' + message + '</h1>';
        }

        function loadPlayer(imdbId) {
            frame.src = `https://api.zenithjs.ws/embed/imdb/${imdbId}`;
        }

        // --- Реализация интерфейса видео-плагина MSX ---
        function MSXPlayerHandler() {
            this.init = function () {
                if (!tmdbId) {
                    showError('Ошибка: ID фильма не передан');
                    return;
                }
                fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/external_ids?api_key=${API_KEY}`)
                    .then((res) => res.json())
                    .then((data) => {
                        if (data.imdb_id) {
                            loadPlayer(data.imdb_id);
                        } else {
                            showError('IMDB ID не найден для этого фильма');
                        }
                    })
                    .catch(() => {
                        showError('Ошибка загрузки данных TMDB');
                    });
            };

            this.ready = function () {
                // Сообщаем MSX, что воспроизведение "началось"
                isPlaying = true;
                startTicking();
                TVXVideoPlugin.startPlayback();
            };

            this.play = function () {
                isPlaying = true;
            };

            this.pause = function () {
                isPlaying = false;
            };

            this.stop = function () {
                isPlaying = false;
                stopTicking();
            };

            this.getDuration = function () {
                return fakeDuration;
            };

            this.getPosition = function () {
                return fakePosition;
            };

            this.setPosition = function (position) {
                fakePosition = position;
            };

            this.setVolume = function () {
                // Громкостью управляет сам embed-плеер внутри iframe,
                // напрямую до него достучаться нельзя (кросс-домен).
            };
        }

        TVXPluginTools.onReady(function () {
            TVXVideoPlugin.setupHandler(new MSXPlayerHandler());
            TVXVideoPlugin.init();
        });
    </script>

</body>
</html>
