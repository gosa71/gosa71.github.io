<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zona Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        /* Сам плеер на весь экран */
        #video-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Рекламный блок внизу */
        #casino-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Высота рекламы */
            z-index: 9999; /* Поверх видео */
            background: rgba(0, 0, 0, 0.7); /* Полупрозрачный фон */
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Чтобы клики проходили сквозь рекламу к плееру */
        }
        #casino-ad img {
            max-height: 100%;
            max-width: 100%;
        }
        /* Текст ошибки */
        #error-msg {
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin-top: 40vh;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <!-- 1. Iframe с плеером -->
    <iframe id="video-frame" src="" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>

    <!-- 2. Твой рекламный баннер казино -->
    <div id="casino-ad">
        <!-- Вставь сюда ссылку на картинку или GIF казино -->
        <a href="https://твое-казино.com" target="_blank">
            <img src="https://via.placeholder.com/468x60/000000/FF0000?text=CASINO+AD" alt="Casino">
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('tmdb_id');
        const frame = document.getElementById('video-frame');
        const body = document.body;

        if (tmdbId) {
            // 1. Спрашиваем у TMDB IMDB ID для этого фильма
            // ВНИМАНИЕ: Замени СЮДА_ВСТАВЬ_СВОЙ_КЛЮЧ на твой API ключ от TMDB!
            fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/external_ids?api_key=65f645cfefa38f91de626946336499b0`)
                .then(res => res.json())
                .then(data => {
                    if (data.imdb_id) {
                        // 2. Вставляем IMDB ID в плеер zenithjs.ws
                        frame.src = `https://api.zenithjs.ws/embed/imdb/${data.imdb_id}`;
                    } else {
                        body.innerHTML = '<h1 id="error-msg">IMDB ID не найден для этого фильма</h1>';
                    }
                })
                .catch(err => {
                    body.innerHTML = '<h1 id="error-msg">Ошибка загрузки данных</h1>';
                });
        } else {
            body.innerHTML = '<h1 id="error-msg">Ошибка: ID фильма не передан</h1>';
        }
    </script>

</body>
</html>
