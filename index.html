<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinoLyaL — смотреть фильмы и сериалы</title>
<link rel="preconnect" href="https://api.zenithjs.ws" crossorigin>
<link rel="preconnect" href="https://harald-as.newplayjj.com" crossorigin>
<link rel="preconnect" href="https://foxs-rss-proxy.ssr5577.workers.dev" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#f97316;--pd:#ea580c;--glow:rgba(249,115,22,.35);--bg:#0b0b1a;--card:rgba(255,255,255,.04);--hover:rgba(255,255,255,.08);--line:rgba(255,255,255,.06);--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--r:16px;--rs:10px}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding:20px 20px 40px;line-height:1.6;background-image:radial-gradient(ellipse at 20% 50%,rgba(139,92,246,.10),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(249,115,22,.08),transparent 50%);background-attachment:fixed}
.app{max-width:960px;margin:0 auto}
.logo{text-align:center;margin-bottom:32px}
.logo a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--t1);font-size:2.6rem;font-weight:900;letter-spacing:-.03em}
.logo-text{background:linear-gradient(135deg,#f97316,#fb923c 50%,#facc15);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{display:block;font-size:.85rem;font-weight:400;color:var(--t2);-webkit-text-fill-color:var(--t2)}
.search{position:relative;margin-bottom:28px}
.box{display:flex;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.box:focus-within{border-color:var(--p);box-shadow:0 0 0 4px var(--glow)}
.in{flex:1;min-width:200px;display:flex;align-items:center;background:rgba(255,255,255,.04);border-radius:var(--rs);padding:0 16px;position:relative}
.in input{width:100%;padding:14px 0 14px 10px;font:500 1rem Inter,sans-serif;background:transparent;border:0;outline:0;color:var(--t1)}
.spin{width:20px;height:20px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--p);border-radius:50%;animation:s .8s linear infinite;display:none}
.spin.on{display:block}@keyframes s{to{transform:rotate(360deg)}}
.btn{padding:12px 24px;font:600 .95rem Inter,sans-serif;border:0;border-radius:var(--rs);cursor:pointer;background:rgba(255,255,255,.06);color:var(--t2)}
.btn:hover{background:rgba(255,255,255,.1);color:var(--t1)}
.btn-p{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff}
.btn-p:hover{background:linear-gradient(135deg,#fb923c,var(--p));color:#fff}
.drop{display:none;position:absolute;top:100%;left:0;right:0;margin-top:6px;background:rgba(18,18,40,.97);border:1px solid var(--line);border-radius:var(--rs);max-height:340px;overflow-y:auto;z-index:100}
.drop.on{display:block}
.drop .st{padding:16px 20px;color:var(--t2);text-align:center}
.it{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--t2)}
.it:last-child{border:0}.it:hover,.it.f{background:var(--hover);color:var(--t1)}.it.f{box-shadow:inset 3px 0 0 var(--p)}
.it img{width:44px;height:62px;object-fit:cover;border-radius:6px;background:var(--card)}
.it b{display:block;color:var(--t1)}.it small{color:var(--t3)}
#hist{left:0;right:0}
#sw{display:none;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}#sw.on{display:flex}
.sw{padding:10px 20px;border:1px solid transparent;border-radius:50px;font:600 .85rem Inter,sans-serif;cursor:pointer;background:rgba(255,255,255,.05);color:var(--t2)}
.sw:hover{color:var(--t1)}.sw.on{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff}
.pb{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.pb.on{display:block}
.pb h2{padding:14px 20px;font-size:1rem;color:var(--t2);background:rgba(0,0,0,.25);border-bottom:1px solid var(--line)}
.wrap{position:relative;height:60vh;min-height:340px;background:#0a0a14}
.sk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t3);background:#0a0a14;z-index:1;text-align:center;padding:20px}
.sk.h{opacity:0;pointer-events:none}
.wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2}
.wh{margin-top:36px}
.wh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wh-head h3{font-size:1.1rem}
.wh-head button{background:none;border:0;color:var(--t3);cursor:pointer;font:500 .85rem Inter,sans-serif}.wh-head button:hover{color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.wc{cursor:pointer}.wc .po{aspect-ratio:2/3;border-radius:var(--rs);background:var(--card) center/cover;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.8rem}
.wc:hover .po{border-color:var(--p)}.wc .n{font-size:.85rem;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wc .d{font-size:.75rem;color:var(--t3)}
@media(max-width:700px){.logo a{font-size:2rem}.box{flex-direction:column}.btn{width:100%}.wrap{height:40vh;min-height:240px}}
</style>
</head>
<body>
<div class="app">
  <div class="logo"><a href="./">🎬 <span><span class="logo-text">KinoLyaL</span><span class="logo-sub">ищи по названию</span></span></a></div>
  <section class="search">
    <div class="box">
      <div class="in">🔍
        <input id="q" type="text" placeholder="Введите ID, ссылку или название фильма" autocomplete="off" autofocus />
        <div class="spin" id="spin"></div>
        <div id="hist" class="drop"></div>
      </div>
      <button class="btn btn-p" id="go">▶ Найти</button>
      <button class="btn" id="share">🔗 Поделиться</button>
    </div>
    <div id="res" class="drop"></div>
  </section>
  <section><div id="sw"></div><div id="pc"></div></section>
  <section class="wh" id="wh" hidden>
    <div class="wh-head"><h3>История просмотров</h3><button id="whClear">Очистить</button></div>
    <div class="grid" id="whGrid"></div>
  </section>
</div>
<script>
const WORKER='https://foxs-rss-proxy.ssr5577.workers.dev';
const ALLOHA_TOKEN='e7b61f129f4a392ac4bf6726a9dd6a';
// ref: '' = referrer по умолчанию (как на рабочих сайтах), для Zenith — no-referrer
const PLAYERS=[
  {name:'Collaps',ref:'no-referrer',url:id=>`https://api.zenithjs.ws/embed/kp/${id}`},
  {name:'Alloha',ref:'',url:id=>`https://harald-as.newplayjj.com/?kp=${id}&token=${ALLOHA_TOKEN}`}
];
const K={player:'kinolyal_last_player',search:'kinolyal_search_history',watch:'kinolyal_watch_history'};
const $=id=>document.getElementById(id);
const q=$('q'),res=$('res'),hist=$('hist');
let focus=-1;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const extractID=s=>{const m=s.match(/kinopoisk\.ru\/(?:film|series)\/(\d+)/);return m?m[1]:s.trim()};
const isID=s=>/^\d{1,10}$/.test(s);

/* ---------- история поиска ---------- */
function addSearch(v){if(v.length<2)return;let h=load(K.search,[]).filter(x=>x!==v);h.unshift(v);save(K.search,h.slice(0,10))}
function showHist(){
  const h=load(K.search,[]);
  if(!h.length||q.value.trim()){hist.classList.remove('on');return}
  hist.innerHTML=h.map((x,i)=>`<div class="it" data-i="${i}">🕐 ${esc(x)}</div>`).join('');
  hist.querySelectorAll('.it').forEach(el=>el.onclick=()=>{q.value=h[el.dataset.i];hist.classList.remove('on');search()});
  hist.classList.add('on');
}
q.addEventListener('focus',showHist);
q.addEventListener('input',showHist);
document.addEventListener('click',e=>{if(!e.target.closest('.in'))hist.classList.remove('on')});

/* ---------- история просмотров ---------- */
function rememberWatch(id,meta){
  let h=load(K.watch,[]);
  const old=h.find(x=>x.id===id)||{};
  h=h.filter(x=>x.id!==id);
  h.unshift({id,name:(meta&&meta.name)||old.name||'',year:(meta&&meta.year)||old.year||'',poster:(meta&&meta.poster)||old.poster||'',ts:Date.now()});
  save(K.watch,h.slice(0,40));
  renderWatch();
}
function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'только что';if(m<60)return m+' мин назад';
  const h=Math.round(m/60);if(h<24)return h+' ч назад';
  return new Date(ts).toLocaleDateString('ru-RU');
}
function renderWatch(){
  const h=load(K.watch,[]),box=$('wh');
  box.hidden=!h.length;
  $('whGrid').innerHTML=h.map(x=>`<div class="wc" data-id="${esc(x.id)}">
    <div class="po" ${x.poster?`style="background-image:url('${esc(x.poster)}')"`:''}>${x.poster?'':'🎬'}</div>
    <div class="n">${esc(x.name||'ID '+x.id)}</div><div class="d">${esc(ago(x.ts))}</div></div>`).join('');
  $('whGrid').querySelectorAll('.wc').forEach(el=>el.onclick=()=>{q.value=el.dataset.id;loadPlayers(el.dataset.id)});
}
$('whClear').onclick=()=>{if(confirm('Очистить историю просмотров?')){save(K.watch,[]);renderWatch()}};

/* ---------- поиск ---------- */
q.addEventListener('keydown',e=>{
  const items=res.querySelectorAll('.it');
  if(!res.classList.contains('on')||!items.length){if(e.key==='Enter')search();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    focus=e.key==='ArrowDown'?Math.min(focus+1,items.length-1):Math.max(focus-1,0);
    items.forEach((it,i)=>it.classList.toggle('f',i===focus));
    items[focus].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){e.preventDefault();focus>=0?items[focus].click():search()}
  else if(e.key==='Escape'){res.classList.remove('on');focus=-1}
});
$('go').onclick=search;
async function search(){
  const raw=q.value.trim();if(!raw)return;
  res.classList.remove('on');hist.classList.remove('on');res.innerHTML='';focus=-1;
  addSearch(raw);
  const id=extractID(raw);
  if(isID(id)){loadPlayers(id);return}
  $('spin').classList.add('on');
  await byTitle(raw);
  $('spin').classList.remove('on');
}
async function byTitle(title){
  res.classList.add('on');
  const key='search_'+title.toLowerCase();
  try{const c=sessionStorage.getItem(key);if(c){render(JSON.parse(c));return}}catch(e){}
  res.innerHTML='<p class="st">🔎 Ищем…</p>';
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(`${WORKER}/search?search=${encodeURIComponent(title)}`,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(j.error)throw new Error(j.error);
    const data=j.results||[];
    try{sessionStorage.setItem(key,JSON.stringify(data))}catch(e){}
    render(data);
  }catch(e){
    console.error('Поиск:',e);
    const why=e.name==='AbortError'?'сервер поиска не ответил за 12 с':e.message==='Failed to fetch'?'запрос заблокирован (сеть или CORS воркера)':e.message;
    res.innerHTML=`<p class="st">❌ Ошибка поиска: ${esc(why)}.<br>Введите ID вручную.</p>`;
  }
}
function render(data){
  if(!data.length){res.innerHTML='<p class="st">😕 Ничего не найдено.</p>';return}
  if(data.length===1){res.classList.remove('on');q.value=data[0].id;loadPlayers(data[0].id,data[0]);return}
  res.innerHTML='';
  data.forEach(r=>{
    const it=document.createElement('div');it.className='it';
    it.innerHTML=`${r.poster?`<img src="${esc(r.poster)}" alt="" loading="lazy">`:''}<div><b>${esc(r.name)}</b>${r.year?`<small>${esc(r.year)}</small>`:''}</div>`;
    it.onclick=()=>{res.classList.remove('on');q.value=r.id;loadPlayers(r.id,r)};
    res.appendChild(it);
  });
}

/* ---------- плееры ---------- */
function loadPlayers(id,meta){
  const pc=$('pc'),sw=$('sw');
  pc.innerHTML='';sw.innerHTML='';sw.classList.remove('on');
  let active=PLAYERS.findIndex(p=>p.name===load(K.player,''));if(active<0)active=0;
  PLAYERS.forEach((p,i)=>{
    const b=document.createElement('div');b.className='pb'+(i===active?' on':'');
    b.innerHTML=`<h2>${esc(p.name)}</h2><div class="wrap"><div class="sk">Загрузка плеера…</div></div>`;
    pc.appendChild(b);
    const open=()=>{
      const w=b.querySelector('.wrap');if(w.querySelector('iframe'))return;
      const sk=w.querySelector('.sk');
      const f=document.createElement('iframe');
      f.allowFullscreen=true;f.title=`Плеер ${p.name} для ID ${id}`;
      if(p.ref)f.referrerPolicy=p.ref;
      f.onload=()=>sk.classList.add('h');
      f.src=p.url(id);
      w.appendChild(f);
      // iframe.onload срабатывает и на страницу с ошибкой, поэтому снимаем заглушку по таймеру
      setTimeout(()=>sk.classList.add('h'),8000);
    };
    if(i===active)open();
    const btn=document.createElement('button');btn.className='sw'+(i===active?' on':'');btn.textContent=`${i+1}. ${p.name}`;
    btn.onclick=()=>{
      sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
      pc.querySelectorAll('.pb').forEach(x=>x.classList.remove('on'));
      btn.classList.add('on');b.classList.add('on');save(K.player,p.name);open();
    };
    sw.appendChild(btn);
  });
  if(PLAYERS.length>1)sw.classList.add('on');
  rememberWatch(id,meta);
  try{history.replaceState(null,'',`?id=${id}`)}catch(e){}
  pc.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- ссылка и старт ---------- */
$('share').onclick=()=>{
  const id=extractID(q.value);
  if(!isID(id)){alert('Введите корректный ID или ссылку');return}
  navigator.clipboard.writeText(`${location.origin}${location.pathname}?id=${id}`)
    .then(()=>alert('✅ Ссылка скопирована!')).catch(()=>alert('❌ Не удалось скопировать'));
};
renderWatch();
const startId=new URLSearchParams(location.search).get('id');
if(startId&&isID(startId)){q.value=startId;loadPlayers(startId)}
</script>
</body>
</html>
